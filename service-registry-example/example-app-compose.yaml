services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../service-discovery-loadbalancer-proxy/src/main/resources:/opt/nginx:rw
    command: ["nginx", "-c", "/opt/nginx/nginx.conf", "-g", "daemon off;"]
    networks:
      - spring-app-network

  proxy-sidecar:
    build:
      context: ../
      dockerfile: ./service-discovery-loadbalancer-proxy/Dockerfile

    volumes:
    - ../service-discovery-loadbalancer-proxy/src/main/resources:/opt/nginx:rw
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ETCD_ENDPOINT: http://etcd:2379
      LOAD_BALANCER_CONTAINER_NAME: nginx
      SERVICE_KEY: /services/user-service/
      LOAD_BALANCER_TEMPLATE_FILE : /opt/nginx/nginx.conf.template
      LOAD_BALANCER_BACKUP_FILE: /opt/nginx/nginx.conf.backup
      LOAD_BALANCER_ACTUAL_FILE: /opt/nginx/nginx.conf
    networks:
      spring-app-network:




  spring_app:
    build:
      context: ../
      dockerfile: ./service-registry-example/Dockerfile
    command:
      - "--spring.profiles.active=docker"
    expose:
      - "8080"
    networks:
      spring-app-network:
    deploy:
      replicas: 5
    depends_on:
      - etcd
      - postgres
    restart: always

  postgres:
    container_name: postgres
    image: 'postgres:17-alpine3.23'
    environment:
      - 'POSTGRES_DB=users_db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    expose:
      - '5432'
    volumes:
      - user-service-volume:/var/lib/postgresql/data
    networks:
      spring-app-network:

  etcd:
    image: bitnami/etcd:latest
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=etcd
    expose:
      - "2379"
      - "2380"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      spring-app-network:

volumes:
  user-service-volume:
  etcd-data:

networks:
  spring-app-network: